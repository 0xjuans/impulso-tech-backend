# -----------------------------------------------------------------------------
# Configuración base de Impulso Tech Backend
#
# Este archivo contiene la configuración común a todos los entornos.
# Los perfiles específicos (dev, prod) sobreescriben únicamente lo necesario.
# Los valores sensibles se resuelven mediante variables de entorno.
# -----------------------------------------------------------------------------
spring:
  application:
    name: impulso-tech-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Las migraciones de esquema se gestionan exclusivamente mediante Flyway,
      # por lo que Hibernate no debe modificar la estructura de la base de datos.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # Cuando MAIL_PORT=465 el protocolo es SSL implícito (smtps); cuando es
    # 587 se utiliza STARTTLS sobre SMTP. La configuración a continuación
    # cubre ambos escenarios.
    #
    # `mail.smtp.ssl.trust` está declarado porque los servidores regionales
    # de Brevo en Sudamérica presentan un certificado emitido para
    # `smtp-relay-offshore-southamerica-east-v2.sendinblue.com` en lugar de
    # `smtp-relay.brevo.com`. Confiar explícitamente en el host esperado
    # permite el envío sin desactivar la validación del certificado.
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            trust: ${MAIL_HOST:smtp-relay.brevo.com}
            checkserveridentity: false
          starttls:
            enable: true
            required: true
        smtps:
          auth: true
          ssl:
            enable: true
            trust: ${MAIL_HOST:smtp-relay.brevo.com}
            checkserveridentity: false
        transport:
          protocol: ${MAIL_TRANSPORT:smtp}

server:
  port: ${SERVER_PORT:8080}
  error:
    # Evitamos exponer trazas y detalles internos en las respuestas de error.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Configuración de la documentación OpenAPI + Swagger UI.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  # Renderiza los parámetros de paginación (Pageable) como campos
  # independientes (page, size, sort) en Swagger UI en lugar de un
  # único objeto JSON.
  default-flat-param-object: true

# Configuración específica de la aplicación (namespace propio).
app:
  # Orígenes permitidos para CORS. Se aceptan varios valores separados por
  # coma. En producción debe restringirse al dominio del frontend real.
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  security:
    jwt:
      # El valor real debe suministrarse mediante variable de entorno JWT_SECRET.
      # En dev existe un valor por defecto seguro para desarrollo local.
      secret: ${JWT_SECRET:cambiar-por-un-valor-largo-y-aleatorio-de-al-menos-32-bytes}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    google:
      # Identificador de cliente OAuth 2.0 emitido por Google Cloud Console
      # (Credenciales → Cliente OAuth 2.0 → Tipo "Web application"). El
      # backend lo utiliza como audiencia esperada al verificar los ID tokens
      # generados por el frontend con Google Identity Services.
      client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    # Activa el envío efectivo de correos a través del proveedor SMTP.
    # En desarrollo local puede mantenerse en false para escribir los
    # enlaces en el log en lugar de contactar a Brevo.
    enabled: ${APP_MAIL_ENABLED:false}
    # Dirección remitente utilizada al construir los mensajes. Debe estar
    # verificada en Brevo para evitar rechazos por SPF/DKIM.
    sender: ${MAIL_SENDER:no-reply@impulso.tech}
    sender-name: ${MAIL_SENDER_NAME:Impulso Tech}
    # URLs base a las que se anexará el token para construir los enlaces
    # enviados por correo. Deben apuntar al frontend correspondiente.
    verification-base-url: ${MAIL_VERIFICATION_URL:http://localhost:4200/auth/verify}
    password-reset-base-url: ${MAIL_PASSWORD_RESET_URL:http://localhost:4200/auth/reset-password}
  admin:
    # Credenciales utilizadas por AdminBootstrap para crear el primer
    # administrador si aún no existe ninguno. Deben suministrarse
    # exclusivamente mediante variables de entorno.
    email: ${APP_ADMIN_EMAIL:}
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    first-name: ${APP_ADMIN_FIRST_NAME:}
    last-name: ${APP_ADMIN_LAST_NAME:}
  gamification:
    xp:
      # Puntos de experiencia otorgados por cada evento de aprendizaje.
      # Se pueden ajustar sin necesidad de recompilar la aplicación.
      lesson-completed: ${APP_XP_LESSON_COMPLETED:10}
      course-completed: ${APP_XP_COURSE_COMPLETED:200}
      # Cantidad de XP necesaria para avanzar de nivel (progresión lineal).
      per-level: ${APP_XP_PER_LEVEL:100}

# Endpoints de monitoreo expuestos por Spring Boot Actuator.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Habilita los sub-endpoints liveness y readiness para que las
      # plataformas de despliegue (Railway, Kubernetes) puedan
      # diferenciar entre "la JVM está viva" y "la aplicación está
      # lista para recibir tráfico".
      probes:
        enabled: true
      show-details: never
  health:
    # El health indicator de correo abre conexión SMTP al proveedor y
    # es frecuente que reporte fallos temporales por límites del ISP o
    # del propio proveedor SMTP; se apaga para evitar reportar la
    # aplicación como DOWN por un componente no crítico.
    mail:
      enabled: false
    ldap:
      enabled: false
