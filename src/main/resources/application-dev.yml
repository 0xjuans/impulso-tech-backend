# -----------------------------------------------------------------------------
# Perfil de desarrollo local.
#
# Utiliza los servicios levantados mediante docker-compose (PostgreSQL y Redis)
# y habilita información adicional de log y de la documentación de la API.
# -----------------------------------------------------------------------------
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:15432/impulso_tech}
    username: ${DATABASE_USERNAME:impulso}
    password: ${DATABASE_PASSWORD:impulso}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

logging:
  level:
    root: INFO
    tech.impulso: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true
